[project]
name = "ddt-qa-agent"
version = "0.1.0"
description = "DDT QA Agent — internal product knowledge assistant"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "pgvector>=0.3,<1",
  "pydantic-settings>=2.7,<3", "python-multipart>=0.0.20,<1",
  "httpx>=0.28,<1", "itsdangerous>=2.2,<3",
  "llama-index-core>=0.12,<1", "pypdf>=5,<7", "python-docx>=1.1,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
"app/main.py" = ["B008"]
"app/auth.py" = ["B008"]
"app/reviews.py" = ["B008"]
"app/observability.py" = ["B008"]
"app/tavern.py" = ["B008"]
